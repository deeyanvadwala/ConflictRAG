# All pipeline settings live here. Change a setting here, then log the change.
embedding_model: BAAI/bge-small-en-v1.5
embedding_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a   # Hugging Face commit; pinned so results are reproducible
query_prefix: "Represent this sentence for searching relevant passages: "

chunk_chars: 1500        # about 350-400 tokens, fits the model's input limit
chunk_overlap: 200
min_chunk_chars: 200     # drop tiny fragments (page numbers, stray headings)

reranker_model: BAAI/bge-reranker-base   # cross-encoder for the rerank strategy
reranker_revision: 2cfc18c9415c912f9d8155881c133215df768a70   # Hugging Face commit, pinned

chroma_path: chroma_db
collection: mars
top_k: 5
retrieval: study_pool_rerank   # 2026-11-23: final system = E1 (changes.md C10); baseline B0 used topk
prompt: guarded          # 2026-11-23: final = guarded (D1); naive = baseline B0; conflict = E2 (rejected)
seed: 42

# Generation (llm.py). Free options only: gemini (free tier) or ollama (local).
llm_provider: ollama     # 2026-11-20: Gemini free tier allows 20 requests/day; one dev eval run needs 60
llm_models:
  gemini: gemini-3.5-flash   # 2026-11-20: 2.5-flash retired for new keys; 3.8-flash returned 503 (overloaded)
  ollama: llama3.1:8b    # must be pulled first: ollama pull llama3.1:8b
  anthropic: claude-haiku-5-5   # paid API, not used under the $0 budget
temperature: 0
max_output_tokens: 4096   # includes Gemini's hidden "thinking" tokens; 1024 cut off judge verdicts
ollama_url: http://localhost:11434
ollama_num_ctx: 8192     # judge prompts are ~3k tokens; the Ollama default would silently truncate them

# Web app (app.py). Caps keep a public demo cheap and hard to abuse.
app:
  max_question_chars: 300
  max_answer_tokens: 600       # replaces max_output_tokens for app answers only
  per_user_per_minute: 4       # requests per browser session per minute
  daily_cap: 200               # total questions per day across all users; resets at midnight UTC
